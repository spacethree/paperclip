name: PR
run-name: >-
  ${{ contains(github.event.pull_request.labels.*.name, 'profile-ci') && (github.event.action != 'labeled' || github.event.label.name == 'profile-ci') && format('CI profile · PR #{0}', github.event.pull_request.number) || '' }}

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]

permissions:
  actions: read
  contents: read
  pull-requests: read

jobs:
  ci:
    if: github.event.action != 'labeled' || github.event.label.name == 'profile-ci' || github.event.label.name == 'full-ci'
    # Master requires CODEOWNERS review for .github/**, including this workflow.
    # The AWS runner group must permit this exact reusable-workflow revision.
    # Keep fork CI reproducible. Update this immutable ref only through the
    # review procedure documented in FORK-POLICY.md.
    uses: paperclipai/paperclip/.github/workflows/pr-trusted.yml@fea61638114a041ffe60cba178f2438bbb06e57b
